
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FloraFav - Simulador Botánico</title>
<link rel="stylesheet" href="https://unpkg.com/98.css@0.1.20/dist/98.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/windows98.css">
</head>
<body>
<main class="window flora-window">
  <div class="title-bar">
    <div class="title-bar-text">FloraFav - Library of Wildflowers</div>
    <div class="title-bar-controls">
      <button aria-label="Minimize"></button>
      <button aria-label="Maximize"></button>
      <button aria-label="Close"></button>
    </div>
  </div>
  <div class="window-body">
    <div class="app-layout">
      <aside class="sidebar">
        <p class="panel-label">Select Plant:</p>
        <ul class="tree-view" id="listaPlantas">
          <li class="selected" data-especie="fleabane">🌿 fleabane</li>
          <li data-especie="clover">🍀 clover</li>
          <li data-especie="violet">🌸 violet</li>
        </ul>
        <fieldset class="genetics-panel">
          <legend>Genetics Lab</legend>
          <button id="mutarPlanta">Random Mutation</button>
          <button id="reiniciarPlanta">Reset Plant</button>
        </fieldset>
      </aside>
      <section class="main-content">
        <fieldset>
          <legend>Morphology Parameters</legend>
          <div class="slider-box">
            <label for="edadSlider">Age (Days):</label>
            <input type="range" id="edadSlider" min="1" max="5" value="1" step="1">
            <strong id="edadValor">1</strong>
          </div>
        </fieldset>
        <div class="canvas-panel sunken-panel" id="canvas-holder"></div>
      </section>
    </div>
    <div class="status-bar">
      <p class="status-bar-field" id="status-especie">Current: fleabane</p>
      <p class="status-bar-field">Engine: L-System 2D</p>
      <p class="status-bar-field">FloraFav Project</p>
    </div>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
