<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>FloraFav - Simulador Botánico</title>
  
  <!-- Cargamos la hoja de estilos auténtica de Windows 98 -->
  <link rel="stylesheet" href="https://unpkg.com">
  
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #55aaaa; /* Fondo verde azulado retro de Windows */
      font-family: Arial, sans-serif;
    }
    
    /* Contenedor principal estilo ventana de Windows 98 */
    .window {
      width: 540px;
      margin: 0 auto;
    }

    .window-body {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Área de herramientas / Controles */
    .fieldset-container {
      padding: 10px;
    }

    .slider-box {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 5px;
    }

    /* Ajuste para que el lienzo de dibujo se adapte a los bordes clásicos */
    #canvas-holder {
      display: block;
      background: #7f7f7f;
      padding: 4px;
    }
    
    #canvas-holder canvas {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Ventana Estilo Windows 98 -->
  <div class="window">
    <!-- Barra de título clásica -->
    <div class="title-bar">
      <div class="title-bar-text">FloraFav - Library of Wildflowers</div>
      <div class="title-bar-controls">
        <button aria-label="Minimize"></button>
        <button aria-label="Maximize"></button>
        <button aria-label="Close"></button>
      </div>
    </div>

    <div class="window-body">
      <!-- Panel de Opciones de PlantStudio -->
      <fieldset class="fieldset-container">
        <legend>Growth Parameters</legend>
        <div class="slider-box">
          <label for="edadSlider">Age (Days):</label>
          <input type="range" id="edadSlider" min="1" max="5" value="1" step="1">
          <span id="edadValor" style="font-weight: bold; width: 20px; text-align: center;">1</span>
        </div>
      </fieldset>

      <!-- Espacio donde se renderiza la planta -->
      <div class="sunken-panel" id="canvas-holder"></div>
      
      <!-- Barra de estado inferior -->
      <div class="status-bar">
        <p class="status-bar-field">Status: Active</p>
        <p class="status-bar-field">Engine: L-System 2D</p>
        <p class="status-bar-field" style="text-align: right;">v1.0</p>
      </div>
    </div>
  </div>

  <!-- Cargamos p5.js al final para garantizar compatibilidad con GitHub Pages -->
  <script src="https://cloudflare.com"></script>

  <script>
    // --- SIMULACIÓN BOTÁNICA PROCEDIMENTAL ---
    const axioma = "X"; 
    const reglas = {
      "X": "F-[[X]+X]+F[+FX]-X",
      "F": "FF"
    };

    let angulo = 25; 
    let longitudInicial = 140; 
    let cadenaActual = axioma;
    let slider;

    function setup() {
      // Ajustamos el tamaño a 524px para que calce perfecto en la ventana gris
      let canvas = createCanvas(524, 450);
      canvas.parent('canvas-holder');
      
      slider = select('#edadSlider');
      slider.input(actualizarPlanta);
      
      calcularPlanta(slider.value());
      noLoop(); 
      redraw(); 
    }

    function draw() {
      background(255); // Lienzo blanco de trabajo limpio
      
      // Dibujamos la maceta/suelo
      stroke(120, 60, 30);
      strokeWeight(4);
      line(width/2 - 30, height - 15, width/2 + 30, height - 15);

      // Posicionamos el brote de la planta en la base central
      translate(width / 2, height - 15);
      rotate(-HALF_PI); 
      
      stroke(34, 139, 34); // Color verde tallo
      strokeWeight(2);

      let factorEscala = pow(0.5, slider.value() - 1);
      let len = longitudInicial * factorEscala;

      for (let i = 0; i < cadenaActual.length; i++) {
        let caracter = cadenaActual.charAt(i);

        if (caracter === "F") {
          line(0, 0, len, 0);
          translate(len, 0);
        } else if (caracter === "+") {
          rotate(radians(angulo));
        } else if (caracter === "-") {
          rotate(radians(-angulo));
        } else if (caracter === "[") {
          push(); 
        } else if (caracter === "]") {
          pop(); 
          
          // Flores terminales rosas típicas de PlantStudio
          push();
          noStroke();
          fill(255, 105, 180); 
          ellipse(0, 0, 7, 7);
          pop();
        }
      }
    }

    function calcularPlanta(iteraciones) {
      cadenaActual = axioma;
      for (let i = 0; i < iteraciones; i++) {
        let siguienteCadena = "";
        for (let j = 0; j < cadenaActual.length; j++) {
          let c = cadenaActual.charAt(j);
          if (reglas[c] !== undefined) {
            siguienteCadena += reglas[c];
          } else {
            siguienteCadena += c;
          }
        }
        cadenaActual = siguienteCadena;
      }
    }

    function actualizarPlanta() {
      select('#edadValor').html(slider.value());
      calcularPlanta(slider.value());
      redraw(); 
    }
  </script>
</body>
</html>
