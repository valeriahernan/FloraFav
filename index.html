<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>FloraFav - Simulador Botánico</title>
  
  <!-- Cargamos la hoja de estilos de Windows 98 -->
  <link rel="stylesheet" href="https://unpkg.com">
  
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #55aaaa; /* Fondo de escritorio clásico */
      font-family: Arial, sans-serif;
    }
    
    /* Ventana principal */
    .window {
      width: 780px;
      margin: 0 auto;
    }

    /* Distribución en dos columnas para emular PlantStudio */
    .app-layout {
      display: flex;
      gap: 12px;
      margin-bottom: 10px;
    }

    /* Columna de la izquierda: Librería de plantas */
    .sidebar {
      width: 220px;
      display: flex;
      flex-direction: column;
    }

    /* Caja de lista estilo Windows 98 */
    ul.tree-view {
      height: 100%;
      min-height: 400px;
      overflow-y: auto;
      background: white;
      margin: 0;
      padding: 5px;
    }

    ul.tree-view li {
      padding: 4px 6px;
      cursor: pointer;
      list-style-type: none;
    }

    /* Estilo para resaltar la planta seleccionada */
    ul.tree-view li.selected {
      background: #000080;
      color: white;
    }

    /* Columna de la derecha: Visualizador y Controles */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .slider-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Contenedor del lienzo con relieve */
    #canvas-holder {
      background: #7f7f7f;
      padding: 4px;
      display: inline-block;
    }
    
    #canvas-holder canvas {
      display: block;
    }
  </style>
</head>
<body>

  <div class="window">
    <!-- Barra de título superior -->
    <div class="title-bar">
      <div class="title-bar-text">FloraFav - Library of Wildflowers (3 plants)</div>
      <div class="title-bar-controls">
        <button aria-label="Minimize"></button>
        <button aria-label="Maximize"></button>
        <button aria-label="Close"></button>
      </div>
    </div>

    <div class="window-body">
      
      <!-- Zona de trabajo dividida -->
      <div class="app-layout">
        
        <!-- COLUMNA IZQUIERDA: MENÚ DE ESPECIES -->
        <div class="sidebar">
          <p style="margin: 0 0 5px 0; font-weight: bold;">Select Plant:</p>
          <ul class="tree-view" id="listaPlantas">
            <li class="selected" data-especie="fleabane">🌿 fleabane</li>
            <li data-especie="clover">🍀 clover</li>
            <li data-especie="violet">🌸 violet</li>
          </ul>
        </div>

        <!-- COLUMNA DERECHA: PANTALLA Y SLIDERS -->
        <div class="main-content">
          <fieldset>
            <legend>Morphology Parameters</legend>
            <div class="slider-box">
              <label for="edadSlider" style="width: 80px;">Age (Days):</label>
              <input type="range" id="edadSlider" min="1" max="5" value="1" step="1">
              <span id="edadValor" style="font-weight: bold; width: 15px;">1</span>
            </div>
          </fieldset>

          <!-- Ventana hundida para el Canvas -->
          <div class="sunken-panel" id="canvas-holder"></div>
        </div>

      </div>
      
      <!-- Barra de estado -->
      <div class="status-bar">
        <p class="status-bar-field" id="status-especie">Current: fleabane</p>
        <p class="status-bar-field">Engine: L-System 2D</p>
        <p class="status-bar-field" style="text-align: right;">FloraFav Project</p>
      </div>

    </div>
  </div>

  <!-- Cargamos p5.js -->
  <script src="https://cloudflare.com"></script>

  <script>
    // --- BASE DE DATOS GENÉTICA (L-SYSTEMS POR ESPECIE) ---
    const especies = {
      fleabane: {
        axioma: "X",
        reglas: { "X": "F-[[X]+X]+F[+FX]-X", "F": "FF" },
        angulo: 25,
        colorTallo:,     // Verde bosque
        colorFlor:,     // Rosa
        longitud: 140
      },
      clover: {
        axioma: "F",
        reglas: { "F": "F[+F]F[-F]F" },
        angulo: 28,
        colorTallo:,     // Verde mar oscuro
        colorFlor:,    // Blanco/Crema
        longitud: 60
      },
      violet: {
        axioma: "X",
        reglas: { "X": "F[-X]+X", "F": "FF" },
        angulo: 35,
        colorTallo:,    // Verde claro
        colorFlor:,     // Violeta profundo
        longitud: 130
      }
    };

    // Planta activa por defecto
    let plantaActiva = especies.fleabane;
    let cadenaActual = "";
    let slider;

    function setup() {
      // Dimensiones para encajar de manera precisa en la columna derecha
      let canvas = createCanvas(520, 400);
      canvas.parent('canvas-holder');
      
      slider = select('#edadSlider');
      slider.input(actualizarPlanta);
      
      // Configurar eventos click en el menú lateral de Windows 98
      let items = selectAll('#listaPlantas li');
      for (let i = 0; i < items.length; i++) {
        items[i].mousePressed(alSeleccionarEspecie);
      }

      cambiarEspecie("fleabane");
      noLoop();
    }

    function draw() {
      background(255);
      
      // Dibujar base del suelo
      stroke(120, 60, 30);
      strokeWeight(4);
      line(width/2 - 30, height - 12, width/2 + 30, height - 12);

      // Posicionar la tortuga botánica
      translate(width / 2, height - 12);
      rotate(-HALF_PI); 
      
      // Aplicar color de tallo de los genes activos
      stroke(plantaActiva.colorTallo[0], plantaActiva.colorTallo[1], plantaActiva.colorTallo[2]); 
      strokeWeight(2);

      // Factor de escala dinámico según la edad de la iteración
      let factorEscala = pow(plantaActiva.axioma === "F" ? 0.4 : 0.5, slider.value() - 1);
      let len = plantaActiva.longitud * factorEscala;

      // Intérprete gráfico de la cadena L-System
      for (let i = 0; i < cadenaActual.length; i++) {
        let caracter = cadenaActual.charAt(i);

        if (caracter === "F") {
          line(0, 0, len, 0);
          translate(len, 0);
        } else if (caracter === "+") {
          rotate(radians(plantaActiva.angulo));
        } else if (caracter === "-") {
          rotate(radians(-plantaActiva.angulo));
        } else if (caracter === "[") {
          push();
        } else if (caracter === "]") {
          pop();
          
          // Dibujar flor con los genes de color activos
          push();
          noStroke();
          fill(plantaActiva.colorFlor[0], plantaActiva.colorFlor[1], plantaActiva.colorFlor[2]);
          ellipse(0, 0, 8, 8);
          pop();
        }
      }
    }

    // Gestionar el cambio de especie en base de datos e interfaz
    function alSeleccionarEspecie() {
      // Quitar clase seleccionada a los demás elementos de la lista
      let items = selectAll('#listaPlantas li');
      for (let i = 0; i < items.length; i++) {
        items[i].removeClass('selected');
      }
      // Marcar el actual
      this.addClass('selected');
      
      let nombreEspecie = this.attribute('data-especie');
      cambiarEspecie(nombreEspecie);
    }

    function cambiarEspecie(nombre) {
      plantaActiva = especies[nombre];
      select('#status-especie').html("Current: " + nombre);
      calcularPlanta(slider.value());
      redraw();
    }

    function calcularPlanta(iteraciones) {
      cadenaActual = plantaActiva.axioma;
      for (let i = 0; i < iteraciones; i++) {
        let siguienteCadena = "";
        for (let j = 0; j < cadenaActual.length; j++) {
          let c = cadenaActual.charAt(j);
          if (plantaActiva.reglas[c] !== undefined) {
            siguienteCadena += plantaActiva.reglas[c];
          } else {
            siguienteCadena += c;
          }
        }
        cadenaActual = siguienteCadena;
      }
    }

    function actualizarPlanta() {
      select('#edadValor').html(slider.value());
      calcularPlanta(slider.value());
      redraw();
    }
  </script>
</body>
</html>
